<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlagForge — Forgot Password</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--ff-space-6);
      background: var(--ff-bg);
    }
    .reset-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      padding: var(--ff-space-8);
    }
    .reset-card .ff-brand {
      display: flex;
      align-items: center;
      gap: var(--ff-space-2);
      font-family: var(--ff-font-display);
      font-weight: 700;
      font-size: var(--ff-text-md);
      color: var(--ff-text);
      text-decoration: none;
      margin-bottom: var(--ff-space-6);
    }
    .reset-card h1 { font-size: var(--ff-text-xl); margin-bottom: var(--ff-space-2); }
    .reset-card .lede { color: var(--ff-text-secondary); font-size: var(--ff-text-sm); margin-bottom: var(--ff-space-6); }
    .reset-card .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--ff-space-1);
      margin-top: var(--ff-space-5);
      font-size: var(--ff-text-sm);
      color: var(--ff-text-muted);
      text-decoration: none;
    }
    .reset-card .submit-btn { width: 100%; justify-content: center; }
  </style>
</head>
<body>
  <div class="reset-card">
    <a href="index.html" class="ff-brand">
      <svg viewBox="0 0 28 28" fill="none" style="width:24px;height:24px;" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#e8a020"/><path d="M8 8v12l4-3.5V8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.5L20 20V8l-8 3.5" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="8" x2="20" y2="8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round"/></svg>
      Flag<span style="color:var(--ff-amber);">Forge</span>
    </a>
    <h1>Reset password</h1>
    <p class="lede">Enter the email for your account and we'll send a reset link.</p>
    <div class="form-group">
      <label class="form-label" for="reset-email">Email</label>
      <input id="reset-email" class="form-input" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <button class="btn btn-primary submit-btn" id="reset-btn" onclick="sendResetEmail()">Send Reset Link</button>
    <a href="login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Sign In
    </a>
  </div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script>
  function sendResetEmail() {
    const email = document.getElementById('reset-email').value.trim();
    if (!email) { showToast('Please enter your email.', 'error'); return; }
    const btn = document.getElementById('reset-btn');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    firebase.auth().sendPasswordResetEmail(email)
      .then(() => {
        showToast('Reset link sent. Check your inbox.', 'success');
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
      })
      .catch(e => {
        showToast(e.code === 'auth/user-not-found' ? 'No account found with this email.' : 'Failed to send reset link.', 'error');
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
      });
  }
</script>
</body>
</html>
