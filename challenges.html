<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlagForge — Challenges</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    .toolbar {
      display: flex;
      gap: var(--ff-space-3);
      align-items: center;
      margin-bottom: var(--ff-space-5);
      flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input { padding-left: 38px; }
    .search-wrap .search-mark {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ff-text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }
    .sort-select {
      background: var(--ff-bg-3);
      border: 1px solid var(--ff-border);
      color: var(--ff-text);
      padding: 9px 12px;
      border-radius: var(--ff-radius-sm);
      font-size: var(--ff-text-sm);
      cursor: pointer;
      font-family: var(--ff-font-body);
    }

    /* Filter chips — compact rectangular */
    .filter-chips { display: flex; gap: var(--ff-space-2); flex-wrap: wrap; margin-bottom: var(--ff-space-3); }
    .chip-row-label {
      font-size: var(--ff-text-xs);
      font-family: var(--ff-font-display);
      font-weight: 600;
      color: var(--ff-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-right: var(--ff-space-2);
      align-self: center;
    }
    .chip {
      padding: 5px 12px;
      border-radius: var(--ff-radius-xs);
      font-size: var(--ff-text-xs);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--ff-border);
      background: none;
      color: var(--ff-text-secondary);
      font-family: var(--ff-font-display);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: border-color var(--ff-duration-fast) var(--ff-ease), color var(--ff-duration-fast) var(--ff-ease), background var(--ff-duration-fast) var(--ff-ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip:hover { border-color: var(--ff-border-strong); color: var(--ff-text); }
    .chip.active { background: var(--ff-amber-soft); border-color: rgba(232, 160, 32, 0.35); color: var(--ff-amber); }
    .chip svg { width: 13px; height: 13px; }

    .results-info {
      font-size: var(--ff-text-sm);
      color: var(--ff-text-muted);
      margin-bottom: var(--ff-space-3);
      font-family: var(--ff-font-mono);
    }

    /* Challenge list — scannable, density-forward */
    .ch-table {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      overflow: hidden;
    }
    .ch-head {
      display: grid;
      grid-template-columns: 44px 1fr 90px 70px 60px;
      gap: var(--ff-space-4);
      padding: var(--ff-space-2) var(--ff-space-5);
      border-bottom: 1px solid var(--ff-border);
    }
    .ch-head span {
      font-size: var(--ff-text-xs);
      font-family: var(--ff-font-display);
      font-weight: 600;
      color: var(--ff-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .ch-row {
      display: grid;
      grid-template-columns: 44px 1fr 90px 70px 60px;
      gap: var(--ff-space-4);
      align-items: center;
      padding: var(--ff-space-3) var(--ff-space-5);
      border-bottom: 1px solid var(--ff-border-subtle);
      text-decoration: none;
      transition: background var(--ff-duration-fast) var(--ff-ease);
    }
    .ch-row:last-child { border-bottom: none; }
    .ch-row:hover { background: var(--ff-surface); }
    .ch-row.solved { opacity: 0.72; }
    .ch-row.solved .ch-title { text-decoration: line-through; text-decoration-color: var(--ff-success); }

    .ch-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--ff-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ch-icon svg { width: 16px; height: 16px; }

    .ch-title { min-width: 0; }
    .ch-title .name {
      font-weight: 500;
      font-size: var(--ff-text-sm);
      color: var(--ff-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-title .meta { font-size: var(--ff-text-xs); color: var(--ff-text-muted); margin-top: 1px; font-family: var(--ff-font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ch-diff { text-align: left; }
    .diff-line {
      display: inline-block;
      width: 3px;
      height: 22px;
      border-radius: var(--ff-radius-xs);
      vertical-align: middle;
      margin-right: 8px;
    }
    .diff-txt { font-size: var(--ff-text-xs); font-family: var(--ff-font-display); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }

    .ch-points { text-align: right; }
    .ch-points .num { font-family: var(--ff-font-display); font-weight: 700; font-size: var(--ff-text-md); color: var(--ff-amber); }

    .ch-state { justify-self: end; position: relative; width: 18px; height: 18px; }
    .ch-state svg { width: 18px; height: 18px; }

    @media (max-width: 700px) {
      .ch-head { display: none; }
      .ch-row {
        grid-template-columns: 40px 1fr auto;
        padding: var(--ff-space-3) var(--ff-space-4);
        gap: var(--ff-space-3);
      }
      .ch-diff { display: none; }
      .ch-state { grid-column: 3; grid-row: 1; }
      .toolbar { padding: 0 var(--ff-space-1); }
    }
  </style>
</head>
<body data-page="challenges">
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="index.html" aria-label="FlagForge home">
        <span class="ff-logo-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#e8a020"/><path d="M8 8v12l4-3.5V8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.5L20 20V8l-8 3.5" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="8" x2="20" y2="8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="ff-wordmark">Flag<span style="color:var(--ff-amber);">Forge</span></span>
      </a>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"></div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Challenges</h1>
      <p>Browse and solve challenges across all categories.</p>
    </div>

    <div class="page-body">
      <!-- Search + sort -->
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="form-input" id="search-input" placeholder="Search challenges…" oninput="applyFilters()" />
        </div>
        <select class="sort-select" id="sort-select" onchange="applyFilters()" aria-label="Sort challenges">
          <option value="points-desc">Points ↓</option>
          <option value="points-asc">Points ↑</option>
          <option value="solves-desc">Most Solved</option>
          <option value="newest">Newest</option>
        </select>
      </div>

      <!-- Category chips -->
      <div class="filter-chips" id="cat-chips">
        <span class="chip-row-label">Category</span>
        <button class="chip active" data-cat="all" onclick="setCategory('all',this)">All</button>
        <button class="chip" data-cat="Web" onclick="setCategory('Web',this)">Web</button>
        <button class="chip" data-cat="Crypto" onclick="setCategory('Crypto',this)">Crypto</button>
        <button class="chip" data-cat="Pwn" onclick="setCategory('Pwn',this)">Pwn</button>
        <button class="chip" data-cat="Forensics" onclick="setCategory('Forensics',this)">Forensics</button>
        <button class="chip" data-cat="Reversing" onclick="setCategory('Reversing',this)">Reversing</button>
        <button class="chip" data-cat="Misc" onclick="setCategory('Misc',this)">Misc</button>
      </div>

      <!-- Difficulty chips -->
      <div class="filter-chips" id="diff-chips">
        <span class="chip-row-label">Difficulty</span>
        <button class="chip active" data-diff="all" onclick="setDifficulty('all',this)">All</button>
        <button class="chip" data-diff="Easy" onclick="setDifficulty('Easy',this)">Easy</button>
        <button class="chip" data-diff="Medium" onclick="setDifficulty('Medium',this)">Medium</button>
        <button class="chip" data-diff="Hard" onclick="setDifficulty('Hard',this)">Hard</button>
        <button class="chip" data-diff="Insane" onclick="setDifficulty('Insane',this)">Insane</button>
      </div>

      <div class="results-info" id="results-info"></div>

      <div class="ch-table" id="ch-list">
        <div class="ch-head">
          <span></span>
          <span>Challenge</span>
          <span>Difficulty</span>
          <span style="text-align:right;">Points</span>
          <span></span>
        </div>
        <div id="challenges-body" style="padding:var(--ff-space-8);text-align:center;color:var(--ff-text-muted);">Loading challenges…</div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/icons.js"></script>
<script src="js/navigation.js"></script>
<script>
  // Replace chip placeholders with real SVGs
  document.querySelectorAll('#cat-chips .chip[data-cat]').forEach(el => {
    const cat = el.dataset.cat;
    if (cat !== 'all') {
      const label = el.textContent.trim();
      el.textContent = '';
      el.innerHTML = FF.catIcon(cat, 13) + ' ' + label;
    }
  });

  const DIFF_COLORS = {
    Easy: 'var(--ff-success)', Medium: 'var(--ff-warning)', Hard: 'var(--ff-danger)', Insane: 'var(--ff-info)'
  };

  let allChallenges = [];
  let userSolves = new Set();
  let currentCat = 'all';
  let currentDiff = 'all';

  requireAuth().then(async user => {
    const userDoc = await db.collection('users').doc(user.uid).get();
    const ud = userDoc.data() || {};
    FF.setNavUser(ud, user);
    if (ud.role === 'admin') FF.setAdminNav();

    const solvesSnap = await db.collection('solves').where('uid', '==', user.uid).get();
    solvesSnap.forEach(d => userSolves.add(d.data().challengeId));

    const snap = await db.collection('challenges').where('published', '==', true).get();
    allChallenges = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    applyFilters();
  });

  function setCategory(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }
  function setDifficulty(diff, btn) {
    currentDiff = diff;
    document.querySelectorAll('#diff-chips .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const sort = document.getElementById('sort-select').value;

    let filtered = allChallenges.filter(ch => {
      if (currentCat !== 'all' && ch.category !== currentCat) return false;
      if (currentDiff !== 'all' && ch.difficulty !== currentDiff) return false;
      if (q && !ch.title?.toLowerCase().includes(q) && !ch.description?.toLowerCase().includes(q)) return false;
      return true;
    });

    filtered.sort((a, b) => {
      if (sort === 'points-asc') return (a.points || 0) - (b.points || 0);
      if (sort === 'points-desc') return (b.points || 0) - (a.points || 0);
      if (sort === 'solves-desc') return (b.solveCount || 0) - (a.solveCount || 0);
      if (sort === 'newest') return (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0);
      return 0;
    });

    document.getElementById('results-info').textContent = `${filtered.length} challenge${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
      document.getElementById('challenges-body').innerHTML = `
        <div class="empty-state">
          ${FF.icons.search}
          <h3>No challenges found</h3>
          <p>Try adjusting your filters or search term.</p>
        </div>`;
      return;
    }

    const html = filtered.map(ch => {
      const solved = userSolves.has(ch.id);
      const cat = ch.category || 'Misc';
      const diff = ch.difficulty || 'Easy';
      const diffColor = DIFF_COLORS[diff] || 'var(--ff-text-muted)';
      return `
        <a href="challenge.html?id=${ch.id}" class="ch-row ${solved ? 'solved' : ''}">
          <div class="ch-icon" style="background:${FF.catColorSoft(cat)};color:${FF.catColor(cat)};">${FF.catIcon(cat, 16)}</div>
          <div class="ch-title">
            <div class="name">${sanitize(ch.title)}</div>
            <div class="meta">${cat} · ${ch.solveCount || 0} solves ${ch.authorName ? '· by ' + sanitize(ch.authorName) : ''}</div>
          </div>
          <div class="ch-diff">
            <span class="diff-line" style="background:${diffColor};"></span>
            <span class="diff-txt" style="color:${diffColor};">${diff}</span>
          </div>
          <div class="ch-points"><span class="num">${ch.points || 0}</span><span style="font-size:var(--ff-text-xs);color:var(--ff-text-muted);"> pts</span></div>
          <div class="ch-state" style="color:${solved ? 'var(--ff-success)' : 'var(--ff-text-muted)'};" title="${solved ? 'Solved' : 'Unsolved'}">
            ${solved ? FF.icons.solved : FF.icons.unsolved}
          </div>
        </a>`;
    }).join('');
    document.getElementById('challenges-body').innerHTML = html;
  }
</script>
</body>
</html>
