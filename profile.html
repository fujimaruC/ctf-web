<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlagForge — My Profile</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    /* Identity header */
    .identity {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      padding: var(--ff-space-8);
      margin-bottom: var(--ff-space-6);
      display: flex;
      align-items: flex-start;
      gap: var(--ff-space-6);
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }
    .identity::after {
      content: '';
      position: absolute;
      right: 0; bottom: 0;
      width: 96px;
      height: 96px;
      border-top: 1px solid var(--ff-border);
      border-left: 1px solid var(--ff-border);
      pointer-events: none;
    }
    .identity-avatar {
      width: 76px;
      height: 76px;
      border-radius: var(--ff-radius-md);
      background: var(--ff-amber-soft);
      border: 1px solid rgba(232, 160, 32, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--ff-font-display);
      font-weight: 700;
      font-size: var(--ff-text-2xl);
      color: var(--ff-amber);
      flex-shrink: 0;
      overflow: hidden;
    }
    .identity-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .identity-info { flex: 1; min-width: 220px; }
    .identity-info .name { font-family: var(--ff-font-display); font-weight: 700; font-size: var(--ff-text-2xl); letter-spacing: -0.02em; }
    .identity-info .handle { color: var(--ff-text-muted); font-size: var(--ff-text-sm); font-family: var(--ff-font-mono); margin-top: 2px; }
    .identity-info .joined { font-size: var(--ff-text-xs); color: var(--ff-text-muted); margin-top: var(--ff-space-1); }
    .identity-badges { display: flex; gap: var(--ff-space-2); flex-wrap: wrap; margin-top: var(--ff-space-3); }

    /* Competition stats strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      overflow: hidden;
      margin-bottom: var(--ff-space-6);
    }
    .stats-strip .stat {
      padding: var(--ff-space-4) var(--ff-space-5);
      border-left: 1px solid var(--ff-border);
    }
    .stats-strip .stat:first-child { border-left: none; }
    .stats-strip .stat .lbl { font-size: var(--ff-text-xs); color: var(--ff-text-muted); font-family: var(--ff-font-display); text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: var(--ff-space-2); }
    .stats-strip .stat .num { font-family: var(--ff-font-display); font-weight: 700; font-size: var(--ff-text-xl); letter-spacing: -0.02em; margin-top: 2px; }

    .prof-grid { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: var(--ff-space-6); align-items: start; }

    /* Solve history frame */
    .panel {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      overflow: hidden;
    }
    .panel-head {
      padding: var(--ff-space-4) var(--ff-space-6);
      border-bottom: 1px solid var(--ff-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head h2 { font-size: var(--ff-text-md); font-family: var(--ff-font-display); font-weight: 600; color: var(--ff-text-secondary); }
    .panel-head .count { font-size: var(--ff-text-xs); color: var(--ff-text-muted); font-family: var(--ff-font-mono); }
    .panel-body { padding: var(--ff-space-4) var(--ff-space-6); }

    .solve-item {
      display: flex;
      align-items: center;
      gap: var(--ff-space-3);
      padding: var(--ff-space-3) 0;
      border-bottom: 1px solid var(--ff-border-subtle);
      text-decoration: none;
    }
    .solve-item:last-child { border-bottom: none; }
    .solve-item .si-icon { width: 32px; height: 32px; border-radius: var(--ff-radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .solve-item .si-icon svg { width: 15px; height: 15px; }
    .solve-item .si-info { flex: 1; min-width: 0; }
    .solve-item .si-name { font-weight: 500; font-size: var(--ff-text-sm); color: var(--ff-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .solve-item .si-meta { font-size: var(--ff-text-xs); color: var(--ff-text-muted); margin-top: 1px; font-family: var(--ff-font-mono); display: flex; gap: var(--ff-space-3); align-items: center; }
    .solve-item .si-pts { font-family: var(--ff-font-display); font-weight: 600; color: var(--ff-success); font-size: var(--ff-text-sm); flex-shrink: 0; }
    .fb-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--ff-danger); font-weight: 600; }
    .fb-tag svg { width: 12px; height: 12px; }

    /* Settings */
    .settings-section {
      padding: var(--ff-space-5) var(--ff-space-6);
    }
    .settings-section + .settings-section { border-top: 1px solid var(--ff-border); }
    .settings-section h3 { font-size: var(--ff-text-xs); font-family: var(--ff-font-display); font-weight: 600; color: var(--ff-text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: var(--ff-space-4); }
    .note { font-size: var(--ff-text-xs); color: var(--ff-text-muted); margin-top: var(--ff-space-1); }

    @media (max-width: 900px) {
      .prof-grid { grid-template-columns: 1fr; }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .stats-strip .stat:nth-child(3) { border-left: none; }
      .stats-strip .stat:nth-child(n+3) { border-top: 1px solid var(--ff-border); }
    }
  </style>
</head>
<body data-page="profile">
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="index.html" aria-label="FlagForge home">
        <span class="ff-logo-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#e8a020"/><path d="M8 8v12l4-3.5V8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.5L20 20V8l-8 3.5" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="8" x2="20" y2="8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="ff-wordmark">Flag<span style="color:var(--ff-amber);">Forge</span></span>
      </a>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"></div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>Player identity, competition record, and account controls.</p>
    </div>

    <div class="page-body">
      <!-- Identity -->
      <div class="identity">
        <div class="identity-avatar" id="profile-avatar">?</div>
        <div class="identity-info">
          <div class="name" id="profile-name">—</div>
          <div class="handle" id="profile-handle">@—</div>
          <div class="joined" id="profile-joined"></div>
          <div class="identity-badges" id="profile-badges"></div>
        </div>
        <div style="position:relative;z-index:1;">
          <button class="btn btn-ghost btn-sm" onclick="openModal('edit-profile-modal')">Edit Profile</button>
        </div>
      </div>

      <!-- Stats strip -->
      <div class="stats-strip">
        <div class="stat">
          <div class="lbl">Points</div>
          <div class="num" id="p-pts" style="color:var(--ff-amber);">—</div>
        </div>
        <div class="stat">
          <div class="lbl">Solves</div>
          <div class="num" id="p-solves">—</div>
        </div>
        <div class="stat">
          <div class="lbl">Rank</div>
          <div class="num" id="p-rank" style="color:var(--ff-success);">#—</div>
        </div>
        <div class="stat">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;" aria-hidden="true"><path d="M12 2c.8 0 1.5.6 1.8 1.5.5 1.5 1.2 3 1.2 4.5 0 1.5-.7 3-1.2 4.5.5 1.5 1.2 3 1.2 4.5 0 1.5-.7 3-1.2 4.5-.3.9-1 1.5-1.8 1.5s-1.5-.6-1.8-1.5c-.5-1.5-1.2-3-1.2-4.5 0-1.5.7-3 1.2-4.5-.5-1.5-1.2-3-1.2-4.5 0-1.5.7-3 1.2-4.5C10.5 2.6 11.2 2 12 2z"/></svg> First Bloods</div>
          <div class="num" id="p-bloods" style="color:var(--ff-danger);">—</div>
        </div>
      </div>

      <div class="prof-grid">
        <!-- Solve history -->
        <div class="panel">
          <div class="panel-head">
            <h2>Solve History</h2>
            <span class="count" id="solve-count-label"></span>
          </div>
          <div class="panel-body" id="solve-history">
            <div style="color:var(--ff-text-muted);font-size:var(--ff-text-sm);text-align:center;padding:var(--ff-space-8) 0;">Loading…</div>
          </div>
        </div>

        <!-- Account settings -->
        <div class="panel">
          <div class="settings-section">
            <h3>Account Settings</h3>
            <div class="form-group">
              <label class="form-label" for="edit-name">Display Name</label>
              <input type="text" class="form-input" id="edit-name" />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-username">Username</label>
              <input type="text" class="form-input" id="edit-username" />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-email">Email</label>
              <input type="email" class="form-input" id="edit-email" disabled style="opacity:0.5;cursor:not-allowed;" />
              <span class="note">Email cannot be changed here.</span>
            </div>
            <button class="btn btn-primary" onclick="saveProfile()" style="width:100%;justify-content:center;">Save Changes</button>
          </div>
          <div class="settings-section">
            <h3>Change Password</h3>
            <div class="form-group">
              <label class="form-label" for="new-password">New Password</label>
              <input type="password" class="form-input" id="new-password" placeholder="Min. 8 characters" />
            </div>
            <button class="btn btn-ghost" onclick="changePassword()" style="width:100%;justify-content:center;">Update Password</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<!-- Edit profile modal -->
<div class="modal-overlay hidden" id="edit-profile-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Profile</div>
      <button class="modal-close" onclick="closeModal('edit-profile-modal')" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label" for="modal-edit-name">Display Name</label>
      <input type="text" class="form-input" id="modal-edit-name" />
    </div>
    <div class="form-group">
      <label class="form-label" for="modal-edit-username">Username</label>
      <input type="text" class="form-input" id="modal-edit-username" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('edit-profile-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProfile(true)">Save</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/icons.js"></script>
<script src="js/navigation.js"></script>
<script>
  requireAuth().then(async user => {
    const userDoc = await db.collection('users').doc(user.uid).get();
    const ud = userDoc.data() || {};
    FF.setNavUser(ud, user);
    if (ud.role === 'admin') FF.setAdminNav();

    const avatarEl = document.getElementById('profile-avatar');
    if (ud.avatar || user.photoURL) avatarEl.innerHTML = `<img src="${ud.avatar || user.photoURL}" alt="" />`;
    else avatarEl.textContent = getInitials(ud.displayName || user.displayName);

    document.getElementById('profile-name').textContent = ud.displayName || user.displayName || 'Player';
    document.getElementById('profile-handle').textContent = `@${ud.username || '—'}`;
    document.getElementById('p-pts').textContent = (ud.points || 0).toLocaleString();
    document.getElementById('p-solves').textContent = ud.solves || 0;
    document.getElementById('p-bloods').textContent = ud.firstBloods || 0;

    if (ud.createdAt) {
      document.getElementById('profile-joined').textContent = 'joined ' + new Date(ud.createdAt.toMillis()).toLocaleDateString();
    }

    const rankSnap = await db.collection('users').where('points', '>', ud.points || 0).get();
    const rank = rankSnap.size + 1;
    document.getElementById('p-rank').textContent = `#${rank}`;

    // Badges — first blood, top 3, admin
    const badges = [];
    if (ud.role === 'admin') badges.push(`<span class="badge" style="background:var(--ff-amber-soft);color:var(--ff-amber);">${FF.icons.admin} Admin</span>`);
    if ((ud.firstBloods || 0) > 0) badges.push(`<span class="badge" style="background:var(--ff-danger-soft);color:var(--ff-danger);">${FF.icons.firstBlood} ${ud.firstBloods} × First Blood</span>`);
    if (rank <= 3) badges.push(`<span class="badge" style="background:var(--ff-warning-soft);color:var(--ff-warning);">${FF.icons.trophy} Top 3</span>`);
    document.getElementById('profile-badges').innerHTML = badges.join('');

    // Prefill edit forms
    document.getElementById('edit-name').value = ud.displayName || user.displayName || '';
    document.getElementById('edit-username').value = ud.username || '';
    document.getElementById('edit-email').value = user.email || '';

    // Solve history
    const solvesSnap = await db.collection('solves').where('uid', '==', user.uid).orderBy('solvedAt', 'desc').get();
    document.getElementById('solve-count-label').textContent = `${solvesSnap.size} total solve${solvesSnap.size !== 1 ? 's' : ''}`;

    if (solvesSnap.empty) {
      document.getElementById('solve-history').innerHTML = `
        <div class="empty-state">
          ${FF.icons.flag}
          <h3>No solves yet</h3>
          <p>Go solve some challenges.</p>
        </div>`;
      return;
    }

    document.getElementById('solve-history').innerHTML = solvesSnap.docs.map(d => {
      const s = d.data();
      const cat = s.category || 'Misc';
      return `
        <a href="challenge.html?id=${s.challengeId}" class="solve-item">
          <div class="si-icon" style="background:${FF.catColorSoft(cat)};color:${FF.catColor(cat)};">${FF.catIcon(cat, 15)}</div>
          <div class="si-info">
            <div class="si-name">${sanitize(s.challengeName)}</div>
            <div class="si-meta">
              <span>${cat}</span>
              <span>${s.difficulty || 'Easy'}</span>
              <span>${timeAgo(s.solvedAt)}</span>
            </div>
          </div>
          <div class="si-pts">+${s.points}</div>
        </a>`;
    }).join('');
  });

  async function saveProfile(fromModal) {
    const user = auth.currentUser;
    if (!user) return;
    const name = (fromModal ? document.getElementById('modal-edit-name') : document.getElementById('edit-name')).value.trim();
    const username = (fromModal ? document.getElementById('modal-edit-username') : document.getElementById('edit-username')).value.trim();
    if (!name || !username) { showToast('Name and username are required.', 'error'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) { showToast('Username can only contain letters, numbers, and underscores.', 'error'); return; }

    try {
      await user.updateProfile({ displayName: name });
      await db.collection('users').doc(user.uid).update({ displayName: name, username });
      document.getElementById('profile-name').textContent = name;
      document.getElementById('profile-handle').textContent = `@${username}`;
      closeModal('edit-profile-modal');
      showToast('Profile updated!', 'success');
    } catch(e) { showToast('Failed to update profile.', 'error'); }
  }

  async function changePassword() {
    const newPw = document.getElementById('new-password').value;
    if (newPw.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
    try {
      await auth.currentUser.updatePassword(newPw);
      document.getElementById('new-password').value = '';
      showToast('Password updated!', 'success');
    } catch(e) {
      if (e.code === 'auth/requires-recent-login') showToast('Please sign out and back in, then try again.', 'error');
      else showToast('Failed to update password.', 'error');
    }
  }
</script>
</body>
</html>
