[build]
  publish = "dist"
  command = "npm ci && npm run build && npm run test:budget"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[context.production.environment]
  VITE_DATA_MODE = "firebase"

[context.branch-deploy.environment]
  VITE_DATA_MODE = "firebase"

[context.deploy-preview.environment]
  # Pull-request previews are intentionally isolated fixtures, never staging.
  VITE_DATA_MODE = "demo"

# React owns known routes. Legacy adapters preserve query parameters.
[[redirects]]
  from = "/challenges/*"
  to = "/index.html"
  status = 200

