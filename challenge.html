<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlagForge — Challenge</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--ff-space-2);
      color: var(--ff-text-muted);
      text-decoration: none;
      font-size: var(--ff-text-sm);
      margin: var(--ff-space-6) 0 var(--ff-space-4);
      transition: color var(--ff-duration-fast) var(--ff-ease);
    }
    .back-link:hover { color: var(--ff-amber); }
    .back-link svg { width: 14px; height: 14px; }

    .ch-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: var(--ff-space-6);
      align-items: start;
    }

    /* ── Mission header ── */
    .mission-head {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      position: relative;
      overflow: hidden;
    }
    .mission-head::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: var(--ff-amber);
      opacity: 0.8;
    }
    .mission-head-inner {
      padding: var(--ff-space-6);
    }
    .mission-kicker {
      display: flex;
      align-items: center;
      gap: var(--ff-space-2);
      font-family: var(--ff-font-display);
      font-size: var(--ff-text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ff-text-muted);
      margin-bottom: var(--ff-space-2);
    }
    .mission-kicker .cat-meta { display: flex; align-items: center; gap: var(--ff-space-2); color: var(--ff-amber); }
    .mission-kicker .cat-meta svg { width: 14px; height: 14px; }
    .mission-title {
      font-size: clamp(24px, 3.5vw, 34px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .mission-by {
      font-size: var(--ff-text-sm);
      color: var(--ff-text-muted);
      margin-top: var(--ff-space-2);
    }
    .mission-meta {
      display: flex;
      gap: var(--ff-space-6);
      padding: var(--ff-space-4) var(--ff-space-6);
      border-top: 1px solid var(--ff-border);
      background: var(--ff-bg-3);
      flex-wrap: wrap;
    }
    .mission-meta .mm { display: flex; flex-direction: column; gap: 1px; }
    .mission-meta .mm .lbl { font-size: 10px; color: var(--ff-text-muted); font-family: var(--ff-font-display); text-transform: uppercase; letter-spacing: 0.8px; }
    .mission-meta .mm .val { font-size: var(--ff-text-sm); font-weight: 500; color: var(--ff-text); }
    .mission-meta .mm .val.mono { font-family: var(--ff-font-mono); }

    /* ── Main content ── */
    .mission-body {
      margin-top: var(--ff-space-6);
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
    }
    .mission-section {
      padding: var(--ff-space-6);
    }
    .mission-section + .mission-section {
      border-top: 1px solid var(--ff-border);
    }
    .mission-section h3 {
      font-size: var(--ff-text-xs);
      font-family: var(--ff-font-display);
      font-weight: 600;
      color: var(--ff-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: var(--ff-space-3);
      display: flex;
      align-items: center;
      gap: var(--ff-space-2);
    }
    .mission-section h3 svg { width: 14px; height: 14px; }
    .desc-body {
      font-size: var(--ff-text-base);
      line-height: 1.8;
      color: var(--ff-text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* File links */
    .file-link {
      display: flex;
      align-items: center;
      gap: var(--ff-space-3);
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-sm);
      background: var(--ff-bg-3);
      padding: var(--ff-space-3) var(--ff-space-4);
      text-decoration: none;
      color: var(--ff-text);
      font-size: var(--ff-text-sm);
      margin-bottom: var(--ff-space-2);
      transition: border-color var(--ff-duration-fast) var(--ff-ease);
    }
    .file-link:last-child { margin-bottom: 0; }
    .file-link:hover { border-color: var(--ff-amber); }
    .file-link .file-ico { color: var(--ff-amber); width: 18px; height: 18px; display: flex; flex-shrink: 0; }
    .file-link .file-ico svg { width: 18px; height: 18px; }
    .file-link .file-info { flex: 1; min-width: 0; }
    .file-link .file-name { font-weight: 500; font-size: var(--ff-text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-link .file-type { font-size: var(--ff-text-xs); color: var(--ff-text-muted); font-family: var(--ff-font-mono); }
    .file-link .file-go { color: var(--ff-text-muted); width: 14px; height: 14px; display: flex; flex-shrink: 0; }
    .file-link .file-go svg { width: 14px; height: 14px; }

    /* ── Solve panel ── */
    .solve-panel {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-md);
      background: var(--ff-bg-2);
      position: sticky;
      top: var(--ff-space-6);
      overflow: hidden;
    }
    .solve-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 2px;
      height: 100%;
      background: var(--ff-border-strong);
    }
    .solve-panel.solved-panel::before { background: var(--ff-success); }
    .solve-top {
      padding: var(--ff-space-5);
      border-bottom: 1px solid var(--ff-border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .solve-top .pts-num {
      font-family: var(--ff-font-display);
      font-weight: 700;
      font-size: var(--ff-text-3xl);
      letter-spacing: -0.02em;
      color: var(--ff-amber);
      line-height: 1;
    }
    .solve-top .pts-lbl { font-size: var(--ff-text-xs); color: var(--ff-text-muted); font-family: var(--ff-font-display); text-transform: uppercase; letter-spacing: 0.8px; }

    .solve-body {
      padding: var(--ff-space-5);
    }
    .solve-label {
      font-size: var(--ff-text-xs);
      font-family: var(--ff-font-display);
      font-weight: 600;
      color: var(--ff-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: var(--ff-space-2);
    }
    .flag-input-wrap { display: flex; gap: var(--ff-space-2); }
    .flag-input-wrap input {
      font-family: var(--ff-font-mono);
      font-size: var(--ff-text-sm);
      letter-spacing: 0.3px;
      flex: 1;
    }
    .attempts-counter {
      font-size: var(--ff-text-xs);
      color: var(--ff-text-muted);
      text-align: center;
      margin-top: var(--ff-space-2);
      font-family: var(--ff-font-mono);
    }

    .solved-banner {
      display: flex;
      align-items: center;
      gap: var(--ff-space-3);
      background: var(--ff-success-soft);
      border: 1px solid rgba(45, 212, 160, 0.25);
      border-radius: var(--ff-radius-sm);
      padding: var(--ff-space-3) var(--ff-space-4);
      margin-bottom: var(--ff-space-4);
    }
    .solved-banner .sb-ico { color: var(--ff-success); width: 22px; height: 22px; flex-shrink: 0; display: flex; }
    .solved-banner .sb-ico svg { width: 22px; height: 22px; }
    .solved-banner .sb-title { font-weight: 700; font-size: var(--ff-text-sm); color: var(--ff-success); font-family: var(--ff-font-display); }
    .solved-banner .sb-sub { font-size: var(--ff-text-xs); color: var(--ff-text-secondary); }

    .solve-section {
      padding: var(--ff-space-5);
      border-top: 1px solid var(--ff-border);
    }
    .solve-section h4 {
      font-size: var(--ff-text-xs);
      font-family: var(--ff-font-display);
      font-weight: 600;
      color: var(--ff-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: var(--ff-space-3);
    }

    /* First blood */
    .fb-line {
      display: flex;
      align-items: center;
      gap: var(--ff-space-3);
      border: 1px solid rgba(240, 82, 82, 0.3);
      background: var(--ff-danger-soft);
      border-radius: var(--ff-radius-sm);
      padding: var(--ff-space-3) var(--ff-space-4);
      margin-bottom: var(--ff-space-4);
    }
    .fb-line .fb-ico { color: var(--ff-danger); width: 18px; height: 18px; display: flex; flex-shrink: 0; }
    .fb-line .fb-ico svg { width: 18px; height: 18px; }
    .fb-line .fb-txt { font-size: var(--ff-text-sm); color: var(--ff-text); }
    .fb-line .fb-txt .fb-name { font-weight: 600; }

    .fb-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ff-danger);
      font-family: var(--ff-font-display);
      font-size: var(--ff-text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .fb-badge svg { width: 13px; height: 13px; }

    /* Hints */
    .hint-item {
      border: 1px solid var(--ff-border);
      border-radius: var(--ff-radius-sm);
      background: var(--ff-bg-3);
      margin-bottom: var(--ff-space-2);
      overflow: hidden;
    }
    .hint-item:last-child { margin-bottom: 0; }
    .hint-item .hint-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--ff-space-3) var(--ff-space-4);
      cursor: pointer;
      font-size: var(--ff-text-sm);
      font-weight: 500;
      color: var(--ff-text);
      width: 100%;
      background: none;
      border: none;
      text-align: left;
    }
    .hint-item .hint-head:hover { color: var(--ff-amber); }
    .hint-cost { font-size: var(--ff-text-xs); color: var(--ff-amber); font-family: var(--ff-font-display); font-weight: 600; }
    .hint-item .hint-body-copy {
      display: none;
      padding: 0 var(--ff-space-4) var(--ff-space-3);
      font-size: var(--ff-text-sm);
      color: var(--ff-text-secondary);
      line-height: 1.6;
      border-top: 1px solid var(--ff-border);
      padding-top: var(--ff-space-3);
    }
    .hint-item.open .hint-body-copy { display: block; }

    /* Recent solvers */
    .solver-item {
      display: flex;
      align-items: center;
      gap: var(--ff-space-3);
      padding: var(--ff-space-2) 0;
      font-size: var(--ff-text-sm);
    }
    .solver-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--ff-radius-sm);
      background: var(--ff-surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--ff-text-xs);
      font-weight: 700;
      flex-shrink: 0;
      color: var(--ff-text-secondary);
    }
    .solver-item .sv-name { font-weight: 500; color: var(--ff-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .solver-item .sv-time { font-size: var(--ff-text-xs); color: var(--ff-text-muted); font-family: var(--ff-font-mono); }

    @media (max-width: 900px) {
      .ch-layout { grid-template-columns: 1fr; }
      .solve-panel { position: static; }
    }
  </style>
</head>
<body data-page="challenges">
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="index.html" aria-label="FlagForge home">
        <span class="ff-logo-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#e8a020"/><path d="M8 8v12l4-3.5V8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.5L20 20V8l-8 3.5" stroke="#0c0e10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="8" x2="20" y2="8" stroke="#0c0e10" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="ff-wordmark">Flag<span style="color:var(--ff-amber);">Forge</span></span>
      </a>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"></div>
  </aside>

  <main class="main-content">
    <div class="page-body" style="padding-top:0;">
      <a href="challenges.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Challenges
      </a>
      <div id="ch-content">
        <div style="text-align:center;padding:var(--ff-space-16) 0;color:var(--ff-text-muted);">Loading challenge…</div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/icons.js"></script>
<script src="js/navigation.js"></script>
<script>
  const chId = new URLSearchParams(window.location.search).get('id');
  let currentUser, userData, challenge, isSolved = false, attempts = 0;

  requireAuth().then(async user => {
    currentUser = user;
    const userDoc = await db.collection('users').doc(user.uid).get();
    userData = userDoc.data() || {};

    FF.setNavUser(userData, user);
    if (userData.role === 'admin') FF.setAdminNav();

    if (!chId) {
      document.getElementById('ch-content').innerHTML = `<div class="empty-state">${FF.icons.search}<h3>Challenge not found</h3><p>The challenge you're looking for doesn't exist.</p></div>`;
      return;
    }

    const chDoc = await db.collection('challenges').doc(chId).get();
    if (!chDoc.exists || !chDoc.data().published) {
      document.getElementById('ch-content').innerHTML = `<div class="empty-state">${FF.icons.search}<h3>Challenge not found</h3><p>The challenge you're looking for doesn't exist.</p></div>`;
      return;
    }
    challenge = { id: chDoc.id, ...chDoc.data() };
    document.title = `FlagForge — ${challenge.title}`;

    const solveDoc = await db.collection('solves').doc(`${user.uid}_${chId}`).get();
    isSolved = solveDoc.exists;

    const attDoc = await db.collection('attempts').doc(`${user.uid}_${chId}`).get();
    attempts = attDoc.exists ? (attDoc.data().count || 0) : 0;

    const solversSnap = await db.collection('solves').where('challengeId', '==', chId).orderBy('solvedAt', 'asc').limit(5).get();
    renderChallenge(solversSnap);
  });

  function renderChallenge(solversSnap) {
    const cat = challenge.category || 'Misc';
    const solvers = solversSnap.docs.map(d => d.data());
    const hasFirstBlood = !!challenge.firstBloodName;

    const solverHTML = solvers.length ? solvers.map((s, i) => `
      <div class="solver-item">
        <div class="solver-avatar">${getInitials(s.playerName)}</div>
        <div style="flex:1;min-width:0;">
          <div class="sv-name">${sanitize(s.playerName)}${i === 0 && s.isFirstBlood ? ' <span class="fb-badge">' + FF.icons.firstBlood + ' First Blood</span>' : ''}</div>
          <div class="sv-time">${timeAgo(s.solvedAt)}</div>
        </div>
      </div>`).join('') : '<p style="font-size:var(--ff-text-sm);color:var(--ff-text-muted);">No solves yet. Be first.</p>';

    const filesHTML = (challenge.files || []).map(f => `
      <a href="${f.url}" target="_blank" rel="noopener" class="file-link">
        <span class="file-ico">${FF.icons.file}</span>
        <span class="file-info">
          <span class="file-name">${sanitize(f.name)}</span>
          <span class="file-type">${sanitize(f.type || 'Download')}</span>
        </span>
        <span class="file-go">${FF.icons.externalLink}</span>
      </a>`).join('');

    const hintsHTML = (challenge.hints || []).map((h, i) => `
      <div class="hint-item" id="hint-${i}">
        <button class="hint-head" onclick="toggleHint(${i})" aria-expanded="false">
          <span>Hint ${i + 1}</span>
          <span class="hint-cost">${h.cost ? `−${h.cost} pts` : 'Free'}</span>
        </button>
        <div class="hint-body-copy">${sanitize(h.text)}</div>
      </div>`).join('');

    const fbHTML = hasFirstBlood
      ? `<div class="fb-line">
          <span class="fb-ico">${FF.icons.firstBlood}</span>
          <span class="fb-txt"><span class="fb-name">${sanitize(challenge.firstBloodName)}</span> hit first blood</span>
        </div>`
      : '';

    document.getElementById('ch-content').innerHTML = `
      <div class="ch-layout">
        <!-- Main -->
        <div>
          <div class="mission-head">
            <div class="mission-head-inner">
              <div class="mission-kicker">
                <span class="cat-meta">${FF.catIcon(cat, 14)} ${cat}</span>
                <span>·</span>
                <span style="color:var(--ff-text-muted);">${challenge.difficulty || 'Easy'}</span>
                ${!challenge.solveCount ? `<span>·</span><span class="fb-badge">${FF.icons.firstBlood} Up for first blood</span>` : ''}
              </div>
              <h1 class="mission-title">${sanitize(challenge.title)}</h1>
              <div class="mission-by">authored by ${sanitize(challenge.authorName || 'Admin')}</div>
            </div>
            <div class="mission-meta">
              <div class="mm"><span class="lbl">Solved</span><span class="val mono">${challenge.solveCount || 0}×</span></div>
              <div class="mm"><span class="lbl">Added</span><span class="val mono">${challenge.createdAt ? new Date(challenge.createdAt.toMillis()).toLocaleDateString() : '—'}</span></div>
              ${challenge.points ? `<div class="mm"><span class="lbl">Value</span><span class="val mono" style="color:var(--ff-amber);">${challenge.points} pts</span></div>` : ''}
              ${challenge.category ? `<div class="mm"><span class="lbl">Category</span><span class="val">${cat}</span></div>` : ''}
            </div>
          </div>

          <div class="mission-body">
            <div class="mission-section">
              <h3>${FF.icons.file} Statement</h3>
              <div class="desc-body" id="desc-body"></div>
            </div>

            ${challenge.files?.length ? `
            <div class="mission-section">
              <h3>${FF.icons.download} Challenge Files</h3>
              ${filesHTML}
            </div>` : ''}
          </div>
        </div>

        <!-- Solve panel -->
        <aside class="solve-panel ${isSolved ? 'solved-panel' : ''}">
          <div class="solve-top">
            <span class="pts-num">${challenge.points || 0}</span>
            <span class="pts-lbl">points</span>
          </div>
          <div class="solve-body">
            <div class="solve-label">Submit Flag</div>
            ${isSolved ? `
              <div class="solved-banner">
                <span class="sb-ico">${FF.icons.solved}</span>
                <div>
                  <div class="sb-title">Challenge Solved</div>
                  <div class="sb-sub">+${challenge.points} points earned</div>
                </div>
              </div>` : ''}
            <div class="flag-input-wrap" ${isSolved ? 'style="opacity:0.45;pointer-events:none;"' : ''}>
              <input type="text" class="form-input" id="flag-input" placeholder="FLAG{…}" autocomplete="off" aria-label="Flag input" onkeydown="if(event.key==='Enter')submitFlag()" />
              <button class="btn btn-primary btn-sm" id="flag-submit-btn" onclick="submitFlag()">Submit</button>
            </div>
            ${!isSolved ? `<div class="attempts-counter" id="attempts-counter">${attempts} attempt${attempts !== 1 ? 's' : ''} made</div>` : ''}
          </div>

          ${fbHTML ? `<div class="solve-section">${fbHTML}</div>` : ''}

          ${challenge.hints?.length ? `
          <div class="solve-section">
            <h4>Hints</h4>
            ${hintsHTML}
          </div>` : ''}

          <div class="solve-section">
            <h4>Recent Solvers</h4>
            <div>${solverHTML}</div>
          </div>
        </aside>
      </div>`;

    document.getElementById('desc-body').textContent = challenge.description || '';
  }

  function toggleHint(i) {
    const item = document.getElementById(`hint-${i}`);
    const btn = item.querySelector('.hint-head');
    item.classList.toggle('open');
    btn.setAttribute('aria-expanded', item.classList.contains('open'));
  }

  async function submitFlag() {
    if (isSolved) return;
    const flag = document.getElementById('flag-input').value.trim();
    if (!flag) { showToast('Please enter a flag.', 'error'); return; }

    const btn = document.getElementById('flag-submit-btn');
    btn.disabled = true;
    btn.textContent = '…';
    const prevText = 'Submit';

    const correctFlag = challenge.flag?.trim();
    const isCorrect = challenge.caseInsensitive
      ? flag.toLowerCase() === correctFlag?.toLowerCase()
      : flag === correctFlag;

    attempts++;
    try {
      await db.collection('attempts').doc(`${currentUser.uid}_${chId}`)
        .set({ count: attempts, uid: currentUser.uid, challengeId: chId }, { merge: true });
    } catch(e) {}

    const counterEl = document.getElementById('attempts-counter');
    if (counterEl) counterEl.textContent = `${attempts} attempt${attempts !== 1 ? 's' : ''} made`;

    if (isCorrect) {
      let firstBloodAwarded = false;
      try {
        await db.runTransaction(async t => {
          const chRef = db.collection('challenges').doc(chId);
          const chSnap = await t.get(chRef);
          if (!chSnap.exists) throw new Error('Challenge not available');

          const existingSolveRef = db.collection('solves').doc(`${currentUser.uid}_${chId}`);
          const existingSolveSnap = await t.get(existingSolveRef);
          if (existingSolveSnap.exists) throw new Error('Already solved');

          const chData = chSnap.data();
          const currentSolveCount = chData.solveCount || 0;
          const isFirstBlood = currentSolveCount === 0 && !chData.firstBloodUid;

          const now = firebase.firestore.FieldValue.serverTimestamp();

          t.set(existingSolveRef, {
            uid: currentUser.uid,
            challengeId: chId,
            challengeName: challenge.title,
            category: challenge.category,
            points: challenge.points,
            difficulty: challenge.difficulty,
            playerName: userData.displayName || currentUser.displayName || 'Player',
            solvedAt: now,
            isFirstBlood
          });

          const updates = { solveCount: currentSolveCount + 1 };
          if (isFirstBlood) {
            updates.firstBloodUid = currentUser.uid;
            updates.firstBloodName = userData.displayName || currentUser.displayName || 'Player';
            updates.firstBloodTimestamp = now;
          }
          t.update(chRef, updates);

          const userRef = db.collection('users').doc(currentUser.uid);
          const userSnap = await t.get(userRef);
          if (!userSnap.exists) throw new Error('User not found');

          t.update(userRef, {
            points: (userSnap.data().points || 0) + challenge.points,
            solves: (userSnap.data().solves || 0) + 1,
            firstBloods: (userSnap.data().firstBloods || 0) + (isFirstBlood ? 1 : 0)
          });

          challenge.solveCount = currentSolveCount + 1;
          firstBloodAwarded = isFirstBlood;
        });

        isSolved = true;
        showToast(`Correct! +${challenge.points} points${firstBloodAwarded ? ' — First Blood!' : ''}`, 'success', 5000);

        const wrap = document.querySelector('.solve-panel');
        if (wrap) wrap.classList.add('solved-panel');

        const inputWrap = document.querySelector('.flag-input-wrap');
        if (inputWrap) { inputWrap.style.opacity = '0.45'; inputWrap.style.pointerEvents = 'none'; }

        inputWrap?.insertAdjacentHTML('beforebegin', `
          <div class="solved-banner">
            <span class="sb-ico">${FF.icons.solved}</span>
            <div>
              <div class="sb-title">Challenge Solved${firstBloodAwarded ? ' — First Blood' : ''}</div>
              <div class="sb-sub">+${challenge.points} points earned</div>
            </div>
          </div>`);

      } catch (err) {
        console.error(err);
        showToast(err.message || 'Solve transaction failed.', 'error');
      }
    } else {
      showToast('Incorrect flag. Keep trying!', 'error');
      const inp = document.getElementById('flag-input');
      inp.style.borderColor = 'var(--ff-danger)';
      setTimeout(() => { inp.style.borderColor = ''; }, 1200);
    }

    btn.textContent = prevText;
    btn.disabled = false;
  }
</script>
</body>
</html>
